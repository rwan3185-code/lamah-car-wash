<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مغسلة لمعة ونقاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* شريط التنبيهات العلوي الثابت */
        #alertBanner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #dc2626;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
            z-index: 9999;
            display: none; /* مخفي افتراضياً ولا يظهر إلا عند وجود حجز جديد */
            animation: slideDown 0.3s ease-in-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .page-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            margin-top: 10px;
        }

        h2 {
            color: var(--primary);
            margin: 0;
            font-size: 22px;
        }

        .btn-logout {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: #fecaca;
        }

        .appointment-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .appointment-card p {
            margin: 8px 0;
            font-size: 15px;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-complete {
            background-color: var(--success);
        }

        .btn-cancel {
            background-color: var(--danger);
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- الشريط الأحمر الثابت أعلى الصفحة للتنبيهات -->
    <div id="alertBanner">🔔 تنبيه جديد: تم استلام حجز جديد في النظام!</div>

    <div class="page-wrapper">
        <div class="header">
            <h2>لوحة تحكم الأدمن</h2>
            <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
        </div>

        <div class="container" id="appointmentsContainer">
            <p class="no-data">جاري تحميل الحجوزات...</p>
        </div>
    </div>

    <!-- صوت التنبيه (تنبيه صوتي هادئ ومباشر عبر الويب) -->
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBoOYPofBjLF8w9RwusNUVXf-ZiFgklx8c",
            authDomain: "car-wash-a68b2.firebaseapp.com",
            projectId: "car-wash-a68b2",
            storageBucket: "car-wash-a68b2.firebasestorage.app",
            messagingSenderId: "560347437788",
            appId: "1:560347437788:web:e4071b760637a240577219",
            measurementId: "G-4SNK4CLCR1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "rwan3185@gmail.com";
        let previousCount = null;

        // حماية صفحة الأدمن
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else if (user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                alert('عذراً، هذه الصفحة خاصة بالمسؤول فقط.');
                window.location.href = 'index.html';
            } else {
                initRealtimeListener();
            }
        });

        // المتابعة الحية للحجوزات (تحديث فوري + صوت + شريط أحمر)
        function initRealtimeListener() {
            const container = document.getElementById('appointmentsContainer');
            const banner = document.getElementById('alertBanner');
            const sound = document.getElementById('notifSound');

            try {
                onSnapshot(collection(db, "appointments"), (querySnapshot) => {
                    if (querySnapshot.empty) {
                        container.innerHTML = '<p class="no-data">لا توجد حجوزات حالياً.</p>';
                        previousCount = 0;
                        return;
                    }

                    let allBookings = [];
                    querySnapshot.forEach((docSnap) => {
                        allBookings.push({ id: docSnap.id, ...docSnap.data() });
                    });

                    // التحقق إذا تم إضافة حجز جديد لإظهار الشريط الصوتي والمرئي
                    if (previousCount !== null && allBookings.length > previousCount) {
                        // إظهار الشريط الأحمر
                        banner.style.display = 'block';
                        // تشغيل الصوت
                        sound.play().catch(e => console.log("متصفح المتصفح منع التشغيل التلقائي للصوت:", e));
                        
                        // إخفاء الشريط الأحمر تلقائياً بعد 6 ثوانٍ
                        setTimeout(() => {
                            banner.style.display = 'none';
                        }, 6000);
                    }
                    previousCount = allBookings.length;

                    // رسم وعرض الحجوزات
                    let html = '';
                    allBookings.forEach((data) => {
                        html += `
                            <div class="appointment-card">
                                <p><strong>اسم العميل:</strong> ${data.name || data.customer_name || 'غير متوفر'}</p>
                                <p><strong>رقم الجوال:</strong> ${data.phone || data.customer_phone || 'غير متوفر'}</p>
                                <p><strong>رقم اللوحة:</strong> ${data.plate || data.car_plate || 'غير متوفر'}</p>
                                <p><strong>الفرع:</strong> ${data.branch || 'غير متوفر'}</p>
                                <p><strong>الخدمة / الباقة:</strong> ${data.service || data.service_name || 'غير متوفر'}</p>
                                <p><strong>التاريخ والوقت:</strong> ${data.date || data.appointment_date || ''} | ${data.time || data.appointment_time || ''}</p>
                                <p><strong>إيميل الحساب:</strong> ${data.userEmail || data.user_email || 'غير متوفر'}</p>
                                <p><strong>الحالة:</strong> <span style="color: ${data.status === 'مكتملة' ? 'green' : (data.status === 'ملغي' ? 'red' : 'orange')}">${data.status || 'قيد الانتظار'}</span></p>
                                
                                <div class="actions">
                                    <button class="btn btn-complete" onclick="updateStatus('${data.id}', 'مكتملة')">تحديد كمكتملة</button>
                                    <button class="btn btn-cancel" onclick="updateStatus('${data.id}', 'ملغي')">إلغاء الحجز</button>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = html;
                });
            } catch (error) {
                console.error("خطأ في جلب الحجوزات: ", error);
                container.innerHTML = '<p class="no-data">حدث خطأ أثناء تحميل الحجوزات.</p>';
            }
        }

        // دالة تحديث الحالة بدون أي رسائل OK
        window.updateStatus = async function(docId, newStatus) {
            try {
                const docRef = doc(db, "appointments", docId);
                await updateDoc(docRef, { status: newStatus });
            } catch (error) {
                console.error("خطأ في تحديث الحالة: ", error);
            }
        };

        // زر تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = 'login.html';
            }).catch((error) => {
                console.error("خطأ أثناء تسجيل الخروج:", error);
            });
        });
    </script>
</body>
</html>
